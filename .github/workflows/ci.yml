name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.35.0
  FLUTTER_SUPPRESS_ANALYTICS: 'true'

jobs:
  content:
    name: Content fidelity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the parser used by the content tools
        run: python -m pip install --quiet --disable-pip-version-check python-docx
      - name: Verify the generated content against the source documents
        run: python3 tools/verify_content.py
      - name: Validate the JSON payloads
        run: |
          python3 - <<'PY'
          import json, pathlib
          for path in sorted(pathlib.Path('assets/content').glob('*.json')):
              with path.open(encoding='utf-8') as handle:
                  data = json.load(handle)
              print(f'{path}: ok ({len(data)} top level keys)')
          PY

  analyze:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore the Flutter SDK
        id: sdk
        uses: actions/cache@v4
        with:
          path: ~/flutter
          key: flutter-sdk-linux-${{ env.FLUTTER_VERSION }}
      - name: Install the official Flutter ${{ env.FLUTTER_VERSION }} SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 3 -o /tmp/flutter.tar.xz \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          tar xf /tmp/flutter.tar.xz -C "$HOME"
      - name: Put Flutter on the PATH
        run: |
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          git config --global --add safe.directory "$HOME/flutter"
      - name: Report the toolchain versions
        run: |
          flutter --version
          dart --version
      - name: Resolve the dependencies
        run: flutter pub get
      - name: Record the resolved dependency versions
        run: |
          cp pubspec.lock resolved-pubspec.lock
      - uses: actions/upload-artifact@v4
        with:
          name: resolved-pubspec-lock
          path: resolved-pubspec.lock
          if-no-files-found: warn
      - name: Static analysis
        run: |
          set +e
          dart analyze --fatal-warnings --format machine > "$RUNNER_TEMP/analysis.txt" 2>&1
          status=$?
          python3 tools/ci_report.py analyze "$RUNNER_TEMP/analysis.txt"
          exit $status
      - name: Tests
        run: |
          set +e
          flutter test --reporter json > "$RUNNER_TEMP/tests.json" 2>&1
          status=$?
          python3 tools/ci_report.py test "$RUNNER_TEMP/tests.json" "$status"
          if [ -f layout-report.txt ]; then
            head -c 4000 layout-report.txt | sed 's/^/::error::/'
          fi
          exit $status

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore the Flutter SDK
        id: sdk
        uses: actions/cache@v4
        with:
          path: ~/flutter
          key: flutter-sdk-linux-${{ env.FLUTTER_VERSION }}
      - name: Install the official Flutter ${{ env.FLUTTER_VERSION }} SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 3 -o /tmp/flutter.tar.xz \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          tar xf /tmp/flutter.tar.xz -C "$HOME"
      - name: Put Flutter on the PATH
        run: |
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          git config --global --add safe.directory "$HOME/flutter"
      - name: Build the release APK
        run: flutter build apk --release
      - name: Verify the packaged APK
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          ls -l "$APK"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS="$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)"
          echo "build-tools: $BUILD_TOOLS"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > /tmp/badging.txt
          head -12 /tmp/badging.txt
          grep -q "package: name='com.techtouchai.mirsam'" /tmp/badging.txt
          grep -q "sdkVersion:'24'" /tmp/badging.txt
          grep -q "targetSdkVersion:'36'" /tmp/badging.txt
          grep -q "application-label:" /tmp/badging.txt
          for asset in \
            assets/content/curriculum.json \
            assets/content/lessons.json \
            assets/content/glossary.json \
            assets/content/plates.json \
            assets/fonts/Almarai-Regular.ttf \
            assets/fonts/Amiri-Regular.ttf \
            assets/illustrations/studio.svg \
            assets/illustrations/perspective.svg \
            assets/images/plates/plate-08.jpg \
            assets/images/plates/plate-19.jpg ; do
            if ! unzip -l "$APK" | grep -q "flutter_assets/$asset"; then
              echo "::error::the APK is missing $asset"
              exit 1
            fi
          done
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libapp.so"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libflutter.so"
          echo "::notice::APK verified: package, SDK levels, label and all bundled assets are present"
      - name: Copy the artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/mirsam-${GITHUB_SHA::7}.apk"
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          {
            echo "name: mirsam"
            echo "package: com.techtouchai.mirsam"
            echo "version: 1.0.0+1"
            echo "commit: $GITHUB_SHA"
            echo "flutter: $FLUTTER_VERSION"
            echo "built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > dist/BUILD-INFO.txt
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: mirsam-android-apk
          path: dist

  windows:
    name: Windows EXE
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Restore the Flutter SDK
        id: sdk
        uses: actions/cache@v4
        with:
          path: C:\flutter
          key: flutter-sdk-windows-${{ env.FLUTTER_VERSION }}
      - name: Install the official Flutter ${{ env.FLUTTER_VERSION }} SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $version = $env:FLUTTER_VERSION
          $manifestUrl = 'https://storage.googleapis.com/flutter_infra_release/releases/releases_windows.json'
          $archivePath = "stable/windows/flutter_windows_$version-stable.zip"
          $listed = $false
          try {
            $manifest = Invoke-RestMethod -Uri $manifestUrl -UseBasicParsing
            $release = $manifest.releases |
              Where-Object { $_.version -eq $version -and $_.channel -eq 'stable' } |
              Select-Object -First 1
            if ($release) {
              $archivePath = $release.archive
              $listed = $true
              Write-Host "Manifest archive: $archivePath"
            } else {
              Write-Host "::warning::version $version not listed in the official manifest"
            }
          } catch {
            Write-Host "::warning::could not read the release manifest: $($_.Exception.Message)"
          }

          $url = "https://storage.googleapis.com/flutter_infra_release/releases/$archivePath"
          $archive = Join-Path $env:RUNNER_TEMP 'flutter.zip'
          $downloaded = $false
          if (-not $listed) {
            Write-Host "The official manifest does not list $version for Windows; using the official git tag instead"
          } else {
            Write-Host "Downloading $url"
          }
          if ($listed) {
          try {
            Invoke-WebRequest -Uri $url -OutFile $archive -UseBasicParsing -MaximumRedirection 5
            $downloaded = (Test-Path $archive) -and ((Get-Item $archive).Length -gt 100MB)
            Write-Host "Archive size: $((Get-Item $archive).Length)"
          } catch {
            Write-Host "::warning::Invoke-WebRequest failed: $($_.Exception.Message)"
          }
          }

          if (-not $downloaded) {
            Write-Host "Falling back to curl.exe"
            curl.exe -fL --retry 3 --retry-delay 5 --retry-all-errors -o $archive $url
            Write-Host "curl exit code: $LASTEXITCODE"
            if (Test-Path $archive) {
              Write-Host "Archive size after curl: $((Get-Item $archive).Length)"
              $downloaded = (Get-Item $archive).Length -gt 100MB
            }
          }

          if (-not $downloaded) {
            Write-Host "::warning::both download methods failed, falling back to a shallow git checkout"
            if (Test-Path 'C:\flutter') { Remove-Item -Recurse -Force 'C:\flutter' }
            git clone --depth 1 --branch $version https://github.com/flutter/flutter.git C:\flutter
            if (-not (Test-Path 'C:\flutter\bin\internal\engine.version')) {
              Write-Host "::error::the git fallback did not produce a Flutter checkout"
              throw 'Flutter SDK unavailable'
            }
          } else {
            Expand-Archive -Path $archive -DestinationPath 'C:\' -Force
          }

          if (-not (Test-Path 'C:\flutter\bin\flutter.bat')) {
            Write-Host "::error::the Flutter SDK is missing at C:\flutter"
            throw 'Flutter SDK layout unexpected'
          }
          Write-Host "::notice::Flutter SDK ready at C:\flutter"

      - name: Put Flutter on the PATH
        shell: pwsh
        run: |
          echo "C:\flutter\bin" >> $env:GITHUB_PATH
          git config --global --add safe.directory C:/flutter
      - name: Enable the Windows desktop target
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter --version
      - name: Resolve the dependencies
        shell: pwsh
        run: flutter pub get
      - name: Report the Visual Studio toolchain
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $path = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            Write-Host "::notice::Visual Studio with C++ tools: $path"
          } else {
            Write-Host "::warning::vswhere.exe not found"
          }
          cmake --version | Select-Object -First 1 | Write-Host
      - name: Precache the Windows engine artifacts
        shell: pwsh
        run: flutter precache --windows
      - name: Build the Windows application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          flutter build windows --release 2>&1 | Tee-Object -FilePath windows-build.log
          $status = $LASTEXITCODE
          python tools/ci_report.py log windows-build.log
          exit $status
      - name: Package the complete distribution folder
        shell: pwsh
        run: |
          $out = 'build\windows\x64\runner\Release'
          if (-not (Test-Path $out)) { throw "Release folder missing: $out" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zip = "dist\mirsam-$($env:GITHUB_SHA.Substring(0,7))-windows-x64.zip"
          Compress-Archive -Path "$out\*" -DestinationPath $zip -Force
          Get-ChildItem $out | Select-Object Name, Length | Format-Table | Out-String | Write-Host
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $([System.IO.Path]::GetFileName($zip))" | Out-File -Encoding ascii dist\SHA256SUMS.txt
          @(
            'name: mirsam',
            'binary: mirsam.exe',
            'version: 1.0.0+1',
            "commit: $env:GITHUB_SHA",
            "flutter: $env:FLUTTER_VERSION",
            "built: $((Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ'))"
          ) | Out-File -Encoding utf8 dist\BUILD-INFO.txt
      - name: Verify the Windows distribution folder
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = Get-ChildItem dist\*.zip | Select-Object -First 1
          $entries = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName).Entries |
            ForEach-Object { $_.FullName.Replace('/', '\') }
          $required = @(
            'mirsam.exe',
            'flutter_windows.dll',
            'data\flutter_assets\assets\content\curriculum.json',
            'data\flutter_assets\assets\fonts\Almarai-Regular.ttf',
            'data\flutter_assets\assets\illustrations\studio.svg',
            'data\flutter_assets\assets\images\plates\plate-08.jpg'
          )
          foreach ($item in $required) {
            if ($entries -notcontains $item) {
              Write-Host "::error::the Windows archive is missing $item"
              exit 1
            }
          }
          Write-Host "::notice::Windows archive verified with $($entries.Count) entries incl. the Flutter engine, data folder and content assets"
      - name: Smoke test the Windows executable
        shell: pwsh
        continue-on-error: true
        run: |
          $exe = 'build\windows\x64\runner\Release\mirsam.exe'
          $stdout = Join-Path $env:RUNNER_TEMP 'mirsam-out.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'mirsam-err.log'
          Write-Host "Launching $exe"
          $process = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $handle = 0
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep -Seconds 1
            $process.Refresh()
            if ($process.HasExited) { break }
            $handle = $process.MainWindowHandle
            if ($handle -ne 0) { break }
          }
          $process.Refresh()
          if ($process.HasExited) {
            Write-Host "::error::mirsam.exe exited during the first 20 seconds with code $($process.ExitCode)"
            Get-Content $stdout, $stderr -ErrorAction SilentlyContinue | Select-Object -Last 40 | ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }
          Write-Host "::notice::mirsam.exe stayed alive for 20s (pid $($process.Id), window handle $handle)"
          Get-Process -Id $process.Id | Select-Object ProcessName, WorkingSet64, MainWindowTitle | Format-List | Out-String | Write-Host
          Stop-Process -Id $process.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: mirsam-windows-x64
          path: dist
