name: Build APK

# Rebo (ريبو) builds on its own branch, independently of main.
# Nothing here touches main: every run produces downloadable artefacts and,
# on a v* tag, attaches them to a GitHub Release.

on:
  # Runs on this branch only. `pull_request` is deliberately absent: the app
  # lives on its own branch and is never merged into main.
  push:
    branches: ['arena/7c94fe0a-rebo']
    tags: ['rebo-v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'أنشئ إصدارًا دائمًا وأرفق الملفات به'
        type: boolean
        default: false

concurrency:
  group: rebo-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # Pinned so repeated builds of identical sources produce identical APKs.
  SOURCE_DATE_EPOCH: '1767225600'
  ANDROID_BUILD_TOOLS: '34.0.0'
  ANDROID_PLATFORM: 'android-34'

jobs:
  checks:
    name: Release gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Version references are in sync
        run: python3 tools/sync-version.py --check

      - name: Content, assets and JavaScript
        run: python3 tools/check.py --skip apk --skip windows

  apk:
    name: Signed APK
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache the Android command-line toolchain
        uses: actions/cache@v4
        with:
          path: tools/.cache
          key: android-tools-${{ env.ANDROID_BUILD_TOOLS }}-${{ env.ANDROID_PLATFORM }}-v1

      - name: Install the Android toolchain the build script expects
        run: bash tools/ci-setup-android.sh

      - name: Build the signed APK
        run: bash build-android.sh

      - name: Verify signature, alignment and package identity
        run: |
          set -euo pipefail
          APK=$(ls dist/rebo-android-v*.apk)
          echo "APK: $APK"
          python3 tools/zipalign.py --verify 4 "$APK"
          java -jar tools/apksigner.jar verify --verbose --print-certs "$APK"
          python3 tools/check.py --skip version --skip windows

      - name: Record the checksum
        run: |
          cd dist
          sha256sum rebo-android-v*.apk | tee APK-SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rebo-android-apk
          path: |
            dist/rebo-android-v*.apk
            dist/APK-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows build
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache zig
        uses: actions/cache@v4
        with:
          path: tools/.cache/zig
          key: zig-0.13.0-linux-x64-v1

      - name: Install zig
        run: bash tools/ci-setup-zig.sh

      - name: Build the host, the loader, the portable zip and the installer
        env:
          ZIG: ${{ github.workspace }}/tools/.cache/zig/zig
        run: bash build-windows.sh

      - name: Verify the produced binaries
        run: python3 tools/check.py --skip version --skip apk

      - uses: actions/upload-artifact@v4
        with:
          name: rebo-windows
          path: |
            dist/Rebo-Setup-*.exe
            dist/Rebo-Windows-*-portable.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [apk, windows]
    # Either a rebo-v* tag, or a manual run with the publish box ticked.
    if: startsWith(github.ref, 'refs/tags/rebo-v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefacts

      - name: Resolve the version
        id: ver
        run: |
          VERSION=$(python3 -c 'import json;print(json.load(open("package.json"))["version"])')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=rebo-v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Collect the files
        run: |
          mkdir -p upload
          find artefacts -type f \( -name '*.apk' -o -name '*.exe' -o -name '*.zip' -o -name 'SHA256*' \) -exec cp {} upload/ \;
          ls -l upload

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: upload/*
          name: ريبو · التربية الفنية ${{ steps.ver.outputs.version }}
          body: |
            نسخة جاهزة من «ريبو · التربية الفنية» — دليل معلم المرحلة المتوسطة، يعمل دون إنترنت.

            - `rebo-android-v*.apk` — أندرويد 7.0 وأحدث (موقّع v1+v2+v3 ومحاذى)
            - `Rebo-Setup-*.exe` — مثبّت ويندوز للمستخدم بلا صلاحيات مدير
            - `Rebo-Windows-*-portable.zip` — نسخة محمولة بلا تثبيت
            - `SHA256SUMS.txt` — للتحقق من سلامة الملفات

            البناء قابل لإعادة الإنتاج: `SOURCE_DATE_EPOCH` ثابت.
            بُني من الفرع `arena/7c94fe0a-rebo` عبر GitHub Actions.
